# The example's Xcode project, generated with XcodeGen: `xcodegen generate --spec ios/project.yml` (build.sh does it).
# The app target is a Swift `main` linked against the Rust static library, which holds activitykit's Swift
# bridge. The widget extension links activitykit's `ActivityKitWidget` product.
name: ActivityKitExample
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  activitykit:
    path: ../../../swift
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # The simulator needs no signing. For a phone, set DEVELOPMENT_TEAM and CODE_SIGN_STYLE: Automatic.
    CODE_SIGNING_ALLOWED: NO
    # Where cargo built the Rust library (build.sh passes its target folder).
    RUST_TARGET_DIR: $(SRCROOT)/../target
    RUST_PROFILE: debug
targets:
  ActivityKitExample:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: ActivityKitExampleWidget
      # The button's intent, which the system runs in the app. Only this product: the rest of activitykit's Swift
      # code is inside the Rust library already, and a second copy would duplicate its symbols.
      - package: activitykit
        product: ActivityKitIntent
      - sdk: AppIntents.framework
      # What the Rust library's objects need (cargo rustc -- --print native-static-libs).
      - sdk: WebKit.framework
      - sdk: UIKit.framework
      - sdk: Security.framework
      - sdk: libiconv.tbd
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ActivityKit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.activitykit.example
        TARGETED_DEVICE_FAMILY: "1"
        # The Rust static library for the platform being built, named by its path (with -l the linker would prefer a
        # dylib of that name).
        RUST_TARGET[sdk=iphoneos*]: aarch64-apple-ios
        RUST_TARGET[sdk=iphonesimulator*][arch=x86_64]: x86_64-apple-ios
        RUST_TARGET[sdk=iphonesimulator*][arch=arm64]: aarch64-apple-ios-sim
        OTHER_LDFLAGS: $(inherited) $(RUST_TARGET_DIR)/$(RUST_TARGET)/$(RUST_PROFILE)/libactivitykit_dioxus_example.a
        # No LIBRARY_SEARCH_PATHS: the target compiles Swift (main.swift), so Xcode adds the Swift runtime's paths, which
        # the bridge's objects in the Rust library need. A target without Swift needs
        # $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) here.
  ActivityKitExampleWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../templates/ios/Widget.swift
    dependencies:
      - package: activitykit
        product: ActivityKitWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.activitykit.example.widget
        INFOPLIST_FILE: ../../../templates/ios/Widget-Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ActivityKitExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ActivityKitExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.activitykit.example.uitests
        TEST_TARGET_NAME: ActivityKitExample
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ActivityKitExample:
    build:
      targets:
        ActivityKitExample: all
        ActivityKitExampleUITests: [test]
    test:
      targets:
        - ActivityKitExampleUITests
