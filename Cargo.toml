[package]
name = "activitykit"
version = "0.6.0"
description = "iOS Live Activities from Rust"
authors = ["1eedaegon"]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1eedaegon/activitykit-rs"
readme = "README.md"
keywords = ["ios", "live-activities", "activitykit", "dynamic-island", "widgetkit"]
categories = ["api-bindings", "gui"]
# One copy of the Swift bridge per app: two versions of this crate would link the same C symbols.
links = "activitykit"
include = [
    "/src/**", "/build.rs", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE-*",
    "/swift/Package.swift", "/swift/Sources/**", "/templates/**", "/contracts/**",
    "/tests/contract.rs", "/tests/schema.rs", "/tests/fixtures/**", "/docs/**",
]

# docs.rs documents the iOS build; build.rs skips Swift there.
[package.metadata.docs.rs]
default-target = "aarch64-apple-ios"
targets = ["aarch64-apple-ios"]

[dependencies]
async-channel = "2"
serde = { version = "1", features = ["derive"] }
# Correctly rounded number parsing, so that a value read from JSON text keeps its value.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# The fingerprint of a start payload.
sha2 = "0.10"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
futures-lite = "2"
